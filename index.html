<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>喝酒记录日历</title>
</head>
<body>

<div class="navbar">
    <div class="container">
        <div class="app-title" style="position:relative;">
            <span id="yearDisplay" style="cursor:pointer;padding:4px 8px;border-radius:8px;transition:all 0.2s;" onclick="toggleYearSelector()" onmouseover="this.style.background='rgba(44,62,80,0.1)'" onmouseout="this.style.background='transparent'">2025</span>
            <span> 喝酒日历</span>
            <!-- 年份选择器 -->
            <div class="year-selector-popup" id="yearSelectorPopup">
                <div class="year-nav">
                    <button class="year-nav-btn" onclick="navigateYearRange(-1)">‹</button>
                    <span class="year-range" id="yearRangeDisplay">2020-2035</span>
                    <button class="year-nav-btn" onclick="navigateYearRange(1)">›</button>
                </div>
                <div class="year-list" id="yearListGrid"></div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                <span id="themeIcon">🌙</span>
            </button>
            <button class="user-manage-btn" onclick="openUserManage()">
                <span>👥</span>
                <span>人员管理</span>
            </button>
            <div class="sync-badge" id="syncStatus">加载中</div>
        </div>
    </div>
</div>

<!-- Tab 导航 -->
<div class="main-tabs">
    <button class="main-tab active" onclick="switchMainTab('calendar')" data-tab="calendar">
        <span class="main-tab-index">01</span>
        <span class="main-tab-copy">
            <span class="main-tab-title">月历</span>
            <span class="main-tab-subtitle">记录与筛选</span>
        </span>
    </button>
    <button class="main-tab" onclick="switchMainTab('stats')" data-tab="stats">
        <span class="main-tab-index">02</span>
        <span class="main-tab-copy">
            <span class="main-tab-title">统计</span>
            <span class="main-tab-subtitle">排行与趋势</span>
        </span>
    </button>
    <button class="main-tab" onclick="switchMainTab('report')" data-tab="report">
        <span class="main-tab-index">03</span>
        <span class="main-tab-copy">
            <span class="main-tab-title">报告</span>
            <span class="main-tab-subtitle">年度回顾</span>
        </span>
    </button>
    <button class="main-tab" onclick="switchMainTab('data')" data-tab="data">
        <span class="main-tab-index">04</span>
        <span class="main-tab-copy">
            <span class="main-tab-title">数据</span>
            <span class="main-tab-subtitle">备份与同步</span>
        </span>
    </button>
</div>

<!-- Tab 1: 月历概览 -->
<div class="tab-content active" id="tab-calendar">
<!-- 1. 日历卡片 -->
<div class="card">
    <!-- 统计概览 -->
    <div class="stats-overview" id="statsOverview"></div>

    <div class="card-header">
        <div class="card-title">月历概览</div>
        <div class="month-ctrl">
            <button class="m-btn" onclick="chYear(-1)" title="上一年">«</button>
            <button class="m-btn" onclick="chMonth(-1)" title="上个月">‹</button>
            <span class="m-txt" id="monthTxt" onclick="toggleMonthSelector()">2025年1月</span>
            <button class="m-btn" onclick="chMonth(1)" title="下个月">›</button>
            <button class="m-btn" onclick="chYear(1)" title="下一年">»</button>
        </div>
    </div>
    
    <!-- 月份选择器弹窗 -->
    <div class="month-selector-popup" id="monthSelector">
        <div class="month-selector-content">
            <div class="year-selector">
                <button class="year-btn" onclick="chYearInSelector(-1)">‹</button>
                <span class="year-display" id="selectorYear">2025</span>
                <button class="year-btn" onclick="chYearInSelector(1)">›</button>
            </div>
            <div class="month-grid" id="monthGrid"></div>
        </div>
    </div>
    
    <!-- 成员筛选 -->
    <div class="filter-container">
        <div class="member-filter-bar" id="memberFilterBar"></div>
    </div>

    <!-- 四宫格说明图例 -->
    <div class="grid-legend" id="gridLegend"></div>

    <div class="cal-head">
        <div class="cal-day-name">日</div><div class="cal-day-name">一</div><div class="cal-day-name">二</div>
        <div class="cal-day-name">三</div><div class="cal-day-name">四</div><div class="cal-day-name">五</div>
        <div class="cal-day-name">六</div>
    </div>
    <div class="cal-body" id="calendarGrid"></div>
</div>
</div>

<!-- Tab 2: 统计排行 -->
<div class="tab-content" id="tab-stats">
<!-- 2. 排行榜卡片 -->
<div class="card">
    <div class="card-header">
        <div class="card-title">统计驾驶舱</div>
        <div class="month-ctrl">
            <button class="m-btn" onclick="chYear(-1)" title="上一年">«</button>
            <button class="m-btn" onclick="chMonth(-1)" title="上个月">‹</button>
            <span class="m-txt" id="statsMonthTxt" onclick="toggleMonthSelector()">2025年1月</span>
            <button class="m-btn" onclick="chMonth(1)" title="下个月">›</button>
            <button class="m-btn" onclick="chYear(1)" title="下一年">»</button>
        </div>
    </div>
    <div class="stats-spotlight" id="statsSpotlight"></div>
    <div class="rank-list" id="rankList"></div>
</div>
</div>

<!-- Tab 3: 年度报告 -->
<div class="tab-content" id="tab-report">
<!-- 4. 年度报告卡片 -->
<div class="card">
    <div class="card-header"><div class="card-title">📊 <span id="reportYearTitle">年度</span>喝酒报告</div></div>
    <div class="report-section">
        <div class="report-user-tabs" id="reportTabs"></div>
        <div class="report-content" id="reportContent"></div>
    </div>
</div>
</div>

<!-- Tab 4: 数据管理 -->
<div class="tab-content" id="tab-data">
<!-- 3. 数据管理卡片 -->
<div class="card">
    <div class="io-section">
        <div class="io-title">📦 数据管理</div>
        <div class="io-desc">导出数据保存备份，或导入之前的数据恢复记录</div>
        <div class="io-btns">
            <button class="io-btn export" onclick="exportData()">
                <span>📥</span> 导出数据
            </button>
            <button class="io-btn import" onclick="document.getElementById('fileInput').click()">
                <span>📤</span> 导入数据
            </button>
        </div>
        <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
    </div>
</div>
</div>

<!-- 5. 录入抽屉 -->
<div class="sheet-mask" id="sheet" onclick="if(event.target===this) closeSheet()">
    <div class="sheet">
        <!-- 头部信息区 -->
        <div class="sheet-header-info">
            <div class="sheet-date-row">
                <div>
                    <div class="sheet-date-main" id="sheetTitle">📅 日期</div>
                    <div id="sheetHoliday"></div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                    <div class="sheet-weekday" id="sheetWeekday">星期一</div>
                    <span class="sheet-close-btn" onclick="closeSheet()">×</span>
                </div>
            </div>
            <!-- 快速统计 -->
            <div class="sheet-stats-row" id="sheetStats"></div>
        </div>

        <!-- 记录选项 -->
        <div id="sheetRows"></div>

        <!-- 公共备注 -->
        <div class="extra-info-section" style="margin-top:16px;">
            <div class="extra-info-row">
                <div class="extra-info-item full-width">
                    <label class="extra-label">📝 今日备注</label>
                    <textarea id="drinkNote" class="extra-textarea" placeholder="记录今天的喝酒心情、地点、伙伴..." rows="2"></textarea>
                </div>
            </div>
        </div>

        <!-- 提醒设置 -->
        <div class="reminder-section" id="reminderSection" style="display:none;">
            <div class="reminder-alert">
                <span class="reminder-icon">⚠️</span>
                <div class="reminder-content">
                    <div class="reminder-title">健康提醒</div>
                    <div class="reminder-text" id="reminderText"></div>
                </div>
            </div>
        </div>

        <!-- 照片上传区域 -->
        <div class="photo-upload">
            <div class="photo-label">📸 今日照片 (可选)</div>
            <div class="photo-preview" id="photoPreview"></div>
        </div>

        <button class="save-btn" onclick="save()">💾 保存并同步</button>
    </div>
</div>

<!-- 6. 人员管理弹窗 -->
<div class="sheet-mask" id="userManageSheet" onclick="if(event.target===this) closeUserManage()">
    <div class="sheet">
        <div class="sheet-header-info">
            <div class="sheet-date-row">
                <div class="sheet-date-main">👥 人员管理</div>
                <span class="sheet-close-btn" onclick="closeUserManage()">×</span>
            </div>
        </div>

        <!-- 人员列表 -->
        <div class="user-list" id="userList"></div>

        <!-- 添加/编辑表单 -->
        <div class="add-user-form" id="userForm" style="display:none;">
            <h3 style="margin:0 0 16px 0;font-size:16px;color:var(--primary);" id="formTitle">➕ 添加新成员</h3>

            <div class="form-group">
                <label class="form-label">姓名</label>
                <input type="text" class="form-input" id="userName" placeholder="请输入姓名">
            </div>

            <div class="form-group">
                <label class="form-label">简称（1-2个字）</label>
                <input type="text" class="form-input" id="userShort" placeholder="用于日历显示" maxlength="2">
            </div>

            <div class="form-group">
                <label class="form-label">颜色主题</label>
                <div class="color-picker-grid" id="colorPicker"></div>
            </div>

            <!-- 位置自动分配，无需手动选择 -->

            <div class="form-actions">
                <button class="form-btn secondary" onclick="cancelUserEdit()">取消</button>
                <button class="form-btn primary" onclick="saveUser()">保存</button>
            </div>
        </div>

        <!-- 添加新成员按钮 -->
        <button class="save-btn" id="addUserBtn" onclick="showAddUserForm()">
            ➕ 添加新成员
        </button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 统计详情弹窗 -->
<div class="stats-detail-popup" id="statsDetailPopup" onclick="if(event.target===this) closeStatsDetail()">
    <div class="stats-detail-content">
        <div class="stats-detail-header">
            <div class="stats-detail-title" id="statsDetailTitle">📊 统计详情</div>
            <button class="stats-detail-close" onclick="closeStatsDetail()">×</button>
        </div>
        <div id="statsDetailBody"></div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
