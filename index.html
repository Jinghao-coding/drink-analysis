<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 喝酒日历</title>
    <style>
        :root {
            --primary: #2c3e50;
            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --text-main: #34495e;
            --text-sub: #95a5a6;
            
            /* 状态色 - 调整得更鲜艳 */
            --c-tipsy: #f1c40f; /* 微醺 - 黄 */
            --c-good: #2ecc71;  /* 刚好 - 绿 */
            --c-drunk: #e74c3c; /* 醉了 - 红 */
            --c-none: #ecf0f1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .navbar {
            background: var(--bg-card);
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .app-title { font-size: 18px; font-weight: 800; color: var(--primary); }
        .sync-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 10px;
            background: #eee; color: #999; font-weight: 500;
        }
        .sync-badge.saved { color: #fff; background: var(--c-good); }
        .sync-badge.saving { color: #fff; background: var(--c-tipsy); }

        .card {
            background: var(--bg-card);
            margin: 15px; border-radius: 16px; padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 700; }
        
        /* 月份切换 */
        .month-ctrl {
            display: flex; align-items: center; gap: 10px; background: #f8f9fa;
            padding: 4px 10px; border-radius: 20px;
        }
        .m-btn {
            border: none; background: none; font-size: 16px; color: var(--primary); padding: 0 5px; cursor: pointer;
        }
        .m-txt { font-weight: bold; font-size: 15px; width: 40px; text-align: center; }

        /* 四宫格图例 */
        .grid-legend {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;
            padding: 10px; background: #fdfdfd; border-radius: 8px; border: 1px dashed #eee;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-sub); }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 日历网格 */
        .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 5px; }
        .cal-day-name { font-size: 11px; color: #ccc; }
        
        .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        
        .day-box {
            aspect-ratio: 1; background: #fff; border: 1px solid #f0f0f0; border-radius: 8px;
            position: relative; cursor: pointer; display: flex; flex-direction: column;
        }
        .day-box.today { border-color: var(--primary); background: #f4f6f8; }
        
        .day-num {
            font-size: 10px; font-weight: bold; color: var(--text-sub);
            position: absolute; top: 2px; left: 3px; z-index: 2;
        }

        /* 核心：四宫格容器 */
        .quad-grid {
            flex: 1; width: 100%; height: 100%;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            padding: 14px 2px 2px 2px; /* Top padding避开数字 */
            gap: 1px;
        }
        
        .quad-cell {
            display: flex; justify-content: center; align-items: center;
        }

        /* 状态点 */
        .status-dot {
            width: 100%; height: 100%; max-width: 14px; max-height: 14px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 8px; color: #fff; font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        /* 状态颜色 */
        .bg-tipsy { background: var(--c-tipsy); }
        .bg-good { background: var(--c-good); }
        .bg-drunk { background: var(--c-drunk); }

        /* 排行榜 */
        .rank-row {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .rank-idx { width: 25px; font-weight: bold; font-style: italic; color: #ccc; }
        .rank-idx.top-1 { color: #f1c40f; }
        .rank-avatar {
            width: 36px; height: 36px; border-radius: 50%; color: white;
            display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; margin-right: 10px;
        }
        .rank-info { flex: 1; }
        .rank-bar-bg { height: 4px; background: #f0f0f0; border-radius: 2px; margin-top: 5px; width: 100%; }
        .rank-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        
        .rank-detail {
            max-height: 0; overflow: hidden; transition: 0.3s; background: #fafafa;
            border-radius: 8px; margin-top: 0;
        }
        .expanded .rank-detail { max-height: 150px; margin-top: 10px; padding: 10px; }
        
        .stat-flex { display: flex; justify-content: space-around; text-align: center; }
        .stat-item h4 { margin: 0; font-size: 18px; }
        .stat-item p { margin: 0; font-size: 10px; color: #999; }

        /* 抽屉 */
        .sheet-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
            display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-mask.show { opacity: 1; pointer-events: auto; }
        .sheet {
            width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 20px;
            transform: translateY(100%); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .sheet-mask.show .sheet { transform: translateY(0); }
        
        .opt-grid { display: flex; gap: 8px; margin-top: 10px; }
        .opt-btn {
            flex: 1; padding: 10px 0; text-align: center; font-size: 12px;
            background: #f5f5f5; border-radius: 8px; border: 1px solid transparent;
        }
        .opt-btn.active[data-v="微醺"] { background: #fff9db; border-color: var(--c-tipsy); color: #e67e22; font-weight: bold; }
        .opt-btn.active[data-v="刚刚好"] { background: #dff9fb; border-color: var(--c-good); color: #16a085; font-weight: bold; }
        .opt-btn.active[data-v="醉了"] { background: #ffdede; border-color: var(--c-drunk); color: #c0392b; font-weight: bold; }

        .save-btn {
            width: 100%; background: var(--primary); color: white; padding: 12px;
            border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 16px;
        }

    </style>
</head>
<body>

<div class="navbar">
    <div class="app-title">📅 2026 喝酒日历</div>
    <div class="sync-badge" id="syncStatus">加载中</div>
</div>

<!-- 1. 日历卡片 -->
<div class="card">
    <div class="card-header">
        <div class="card-title">月历概览</div>
        <div class="month-ctrl">
            <button class="m-btn" onclick="chMonth(-1)">‹</button>
            <span class="m-txt" id="monthTxt">1月</span>
            <button class="m-btn" onclick="chMonth(1)">›</button>
        </div>
    </div>

    <!-- 四宫格说明图例 -->
    <div class="grid-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#8e44ad"></div>王 (左上)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2980b9"></div>郭 (右上)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#d35400"></div>路 (左下)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#16a085"></div>高 (右下)</div>
    </div>

    <div class="cal-head">
        <div class="cal-day-name">日</div><div class="cal-day-name">一</div><div class="cal-day-name">二</div>
        <div class="cal-day-name">三</div><div class="cal-day-name">四</div><div class="cal-day-name">五</div>
        <div class="cal-day-name">六</div>
    </div>
    <div class="cal-body" id="calendarGrid"></div>
</div>

<!-- 2. 排行榜卡片 -->
<div class="card">
    <div class="card-header"><div class="card-title">统计排行 (点击展开)</div></div>
    <div id="rankList"></div>
</div>

<!-- 3. 录入抽屉 -->
<div class="sheet-mask" id="sheet" onclick="if(event.target===this) closeSheet()">
    <div class="sheet">
        <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
            <span style="font-weight:bold;font-size:18px;" id="sheetTitle">日期</span>
            <span onclick="closeSheet()" style="font-size:20px;color:#999;">×</span>
        </div>
        <div id="sheetRows"></div>
        <button class="save-btn" onclick="save()">保存状态</button>
    </div>
</div>

<script>
    // 配置
    const BIN_ID = "697e0a63d0ea881f40962da0"; 
    const API_KEY = "$2a$10$rvgEXLG9D/lIo3jHDDhfFeiPY00PfhQo21ZWJzVbKlpahwi33MIzG";

    // 用户定义：增加了“位置”说明
    const USERS = [
        { name: '王思', short: '王', color: '#8e44ad', pos: '左上' }, // Purple
        { name: '郭思', short: '郭', color: '#2980b9', pos: '右上' }, // Blue
        { name: '路思', short: '路', color: '#d35400', pos: '左下' }, // Orange
        { name: '高思', short: '高', color: '#16a085', pos: '右下' }  // Green
    ];
    
    // 状态定义
    const STATUS_MAP = {
        '': { cls: '' },
        '微醺': { cls: 'bg-tipsy', val: 1 },
        '刚刚好': { cls: 'bg-good', val: 2 },
        '醉了': { cls: 'bg-drunk', val: 3 }
    };
    const OPTS = ['', '微醺', '刚刚好', '醉了'];

    let appData = {};
    let curMonth = new Date().getMonth();
    let curYear = 2026;
    let editDay = 1;
    let tempEdit = {};
    
    // 适配年份
    const now = new Date();
    if (now.getFullYear() === 2026) curMonth = now.getMonth();

    document.addEventListener('DOMContentLoaded', () => {
        render();
        pull();
    });

    function chMonth(d) {
        let n = curMonth + d;
        if(n<0)n=0; if(n>11)n=11;
        curMonth = n;
        render();
    }

    function render() {
        document.getElementById('monthTxt').innerText = `${curMonth+1}月`;
        
        // 1. 日历
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const fDay = new Date(curYear, curMonth, 1).getDay();
        const tDays = new Date(curYear, curMonth+1, 0).getDate();

        for(let i=0; i<fDay; i++) grid.appendChild(document.createElement('div'));

        for(let d=1; d<=tDays; d++) {
            const cell = document.createElement('div');
            cell.className = 'day-box';
            if(now.getFullYear()===curYear && now.getMonth()===curMonth && now.getDate()===d) cell.classList.add('today');
            
            // 四宫格生成
            let dotsHTML = '';
            for(let i=0; i<4; i++) {
                const s = appData[curMonth]?.[d]?.[i];
                let inner = '';
                if(s && s !== '') {
                    // 有状态：显示颜色点 + 名字
                    inner = `<div class="status-dot ${STATUS_MAP[s].cls}" style="border:1px solid ${USERS[i].color}">${USERS[i].short}</div>`;
                } else {
                    // 无状态：空占位，保持排版
                    inner = ``; 
                }
                dotsHTML += `<div class="quad-cell">${inner}</div>`;
            }

            cell.innerHTML = `<span class="day-num">${d}</span><div class="quad-grid">${dotsHTML}</div>`;
            cell.onclick = () => openSheet(d);
            grid.appendChild(cell);
        }

        // 2. 排行榜
        const list = document.getElementById('rankList');
        let stats = USERS.map((u, i) => {
            let t = 0;
            let d = { '微醺':0, '刚刚好':0, '醉了':0 };
            for(let day=1; day<=tDays; day++) {
                const s = appData[curMonth]?.[day]?.[i];
                if(s && s!=='') { t++; if(d[s]!==undefined) d[s]++; }
            }
            return { ...u, total:t, details:d, idx:i };
        });
        
        stats.sort((a,b) => b.total - a.total);
        const max = stats[0]?.total || 1;

        list.innerHTML = stats.map((item, idx) => {
            const pct = (item.total/max)*100;
            const rCls = idx<3 ? `top-${idx+1}` : '';
            return `
                <div class="rank-row" onclick="this.classList.toggle('expanded')">
                    <div style="width:100%; display:flex; align-items:center;">
                        <span class="rank-idx ${rCls}">${idx+1}</span>
                        <div class="rank-avatar" style="background:${item.color}">${item.short}</div>
                        <div class="rank-info">
                            <div style="display:flex;justify-content:space-between;">
                                <b>${item.name}</b>
                                <b>${item.total} 天</b>
                            </div>
                            <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${pct}%;background:${item.color}"></div></div>
                        </div>
                    </div>
                    <!-- 详情折叠 -->
                    <div style="flex-basis:100%;" class="rank-detail">
                        <div class="stat-flex">
                            <div class="stat-item"><h4 style="color:var(--c-tipsy)">${item.details['微醺']}</h4><p>微醺</p></div>
                            <div class="stat-item"><h4 style="color:var(--c-good)">${item.details['刚刚好']}</h4><p>刚好</p></div>
                            <div class="stat-item"><h4 style="color:var(--c-drunk)">${item.details['醉了']}</h4><p>醉了</p></div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Sheet
    function openSheet(d) {
        editDay = d;
        document.getElementById('sheetTitle').innerText = `${curMonth+1}月${d}日`;
        const dayData = appData[curMonth]?.[d] || {};
        tempEdit = {...dayData};
        
        document.getElementById('sheetRows').innerHTML = USERS.map((u, i) => {
            const cur = dayData[i] || '';
            const btns = OPTS.map(o => {
                const label = o===''?'无':o;
                const act = cur===o?'active':'';
                return `<div class="opt-btn ${act}" data-v="${o}" onclick="setOpt(${i},'${o}',this)">${label}</div>`;
            }).join('');
            return `<div style="margin-bottom:12px;"><div style="font-weight:bold;margin-bottom:4px;color:${u.color}">${u.name}</div><div class="opt-grid" id="rg-${i}">${btns}</div></div>`;
        }).join('');
        
        document.getElementById('sheet').classList.add('show');
    }

    window.setOpt = function(i, v, el) {
        tempEdit[i] = v;
        document.getElementById(`rg-${i}`).querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));
        el.classList.add('active');
    }

    function closeSheet() { document.getElementById('sheet').classList.remove('show'); }

    function save() {
        if(!appData[curMonth]) appData[curMonth]={};
        appData[curMonth][editDay] = tempEdit;
        closeSheet();
        render();
        push();
    }

    async function pull() {
        updSync('saving', '同步中');
        try {
            const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: {'X-Master-Key': API_KEY}});
            const j = await r.json();
            appData = j.record || {};
            if(appData.status==='start') appData={};
            render(); updSync('saved','已同步');
        } catch(e) { updSync('', '离线'); }
    }

    async function push() {
        updSync('saving', '保存中');
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT', headers: {'Content-Type':'application/json','X-Master-Key':API_KEY},
                body: JSON.stringify(appData)
            });
            updSync('saved','已保存');
        } catch(e) {}
    }

    function updSync(c,t) { 
        const el=document.getElementById('syncStatus'); el.className=`sync-badge ${c}`; el.innerText=t; 
    }
</script>
</body>
</html>
